[package]
name = "rman"
version = "0.3.0"
authors = ["ev3nvy"]
edition = "2021"
description = "Parser for Riot Manifest file format."
repository = "https://github.com/ev3nvy/rman-rs"
license = "MIT OR Apache-2.0"
keywords = ["rman", "riot", "rito", "manifest", "riot-manifest"]
categories = ["data-structures", "encoding", "parser-implementations"]

[dependencies]
byteorder = "1.5.0"
flatbuffers = "25.12.19"
log = "0.4.29"
reqwest = { version = "0.13.2", default_features = false }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"
zstd = "0.13.3"

[build-dependencies]
flatbuffers = "25.12.19"
zstd = "0.13.3"

[dev-dependencies]
httptest = "0.16.4"
tokio = { version = "1.49.0", default_features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = ["rustls"]
version_error = []
serde = ["dep:serde"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

# docs.rs-specific configuration
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
